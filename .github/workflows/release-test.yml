name: release-test
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号"
        required: false
        default: ""
      otd_ref:
        description: "OTD fork ref"
        required: false
        default: "pr4672-bluetooth-macos"
      penassist_ref:
        description: "PenAssist ref"
        required: false
        default: "master"
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install rcodesign
        run: |
          gh release download "apple-codesign/0.29.0" -R indygreg/apple-platform-rs \
            -p "apple-codesign-0.29.0-aarch64-apple-darwin.tar.gz*" --clobber
          tar xzf apple-codesign-0.29.0-aarch64-apple-darwin.tar.gz
          mkdir -p "$HOME/.local/bin"
          cp apple-codesign-0.29.0-aarch64-apple-darwin/rcodesign "$HOME/.local/bin/"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Decode signing cert
        run: |
          mkdir -p certs
          base64 -d <<< "$OTD_BT_P12_B64" > certs/otd-bt-dev-10y.p12
          printf '%s' "$OTD_BT_P12_PW" > certs/otd-bt-dev-10y.pw
          chmod 600 certs/otd-bt-dev-10y.p12 certs/otd-bt-dev-10y.pw
        env:
          OTD_BT_P12_B64: ${{ secrets.OTD_BT_P12_B64 }}
          OTD_BT_P12_PW: ${{ secrets.OTD_BT_P12_PW }}

      - name: Build
        run: bash scripts/build-app.sh
        env:
          VERSION: ${{ github.event.inputs.version }}
          OTD_REF: ${{ github.event.inputs.otd_ref || 'pr4672-bluetooth-macos' }}
          PENASSIST_REF: ${{ github.event.inputs.penassist_ref || 'master' }}

      - name: Create release
        run: |
          VERSION_FILE=tmp/dist/version.txt
          ls tmp/dist/
          ZIP=$(ls tmp/dist/otd-bt-*.zip | head -1)
          VERSION_NAME=$(basename "$ZIP" .zip | sed 's/^otd-bt-//')
          TAG="v${VERSION_NAME}"
          SHA=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --title "otd-bt $VERSION_NAME" \
              --notes "OpenTabletDriver BT (macOS) + PenAssist. 首次安装需授权辅助功能/输入监控。"
          fi
          echo "$TAG" > "$VERSION_FILE"
          echo "$SHA" >> "$VERSION_FILE"
          echo "$VERSION_NAME" >> "$VERSION_FILE"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update cask
        run: |
          readarray -t V < tmp/dist/version.txt
          TAG="${V[0]}" SHA="${V[1]}" VERSION="${V[2]}"
          python3 - "$VERSION" "$SHA" << 'EOF'
          import sys, re
          version, sha = sys.argv[1], sys.argv[2]
          p = "Casks/otd-bt.rb"
          s = open(p).read()
          s = re.sub(r'version "[^"]*"', f'version "{version}"', s)
          s = re.sub(r'sha256 "[^"]*"', f'sha256 "{sha}"', s)
          open(p, "w").write(s)
          EOF
          git config user.name "release-bot"
          git config user.email "noreply@github.com"
          git add Casks/otd-bt.rb
          git commit -m "cask: bump to $VERSION" || true
          git push
        env:
          GH_TOKEN: ${{ github.token }}
